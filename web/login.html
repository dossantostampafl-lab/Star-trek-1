<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Star Trek 1 — Acesso</title>
<style>
  :root { color-scheme: dark; --amber: #ffb347; --cyan: #5ec8ff; --line: #22344d; --ink: #d7e6f5; --dim: #7f95ad; --red: #ff6b7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at top, #0d1420, #070b12 70%); color: var(--ink);
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  form { width: min(360px, 100%); background: #0f1826; border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .18em; color: var(--amber); text-shadow: 0 0 8px rgba(255,179,71,.45); }
  h1 span { color: var(--cyan); }
  p { margin: 0; color: var(--dim); font-size: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  input { font: inherit; color: var(--ink); background: #070b12; border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; }
  input:focus-visible, button:focus-visible { outline: 2px solid #ffe066; outline-offset: 2px; }
  button { font: inherit; font-weight: 700; background: var(--amber); color: #1a1000; border: 0; border-radius: 4px; padding: 10px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: var(--red); min-height: 1.2em; font-size: 12px; }
</style>
</head>
<body>
<form id="f">
  <h1><span>★</span> STAR TREK 1</h1>
  <p>Estação protegida. Digite a senha de acesso.</p>
  <label>Senha <input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <button id="go">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script src="/login.js"></script>
</body>
</html>
