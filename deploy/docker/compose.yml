# Star Trek 1 + FreeLLMAPI ao lado de outro projeto que já tem um Caddy em container.
# Nenhuma porta é publicada: o Caddy do outro projeto alcança os dois pela rede Docker dele (PROXY_NETWORK).
# Gerenciado por deploy/oracle/setup-docker.sh — as variáveis vêm de deploy/docker/.env.
name: star-trek-1

services:
  star-trek:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: star-trek-1:local
    container_name: star-trek-1
    restart: unless-stopped
    env_file: ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /var/lib/startrek/data
      WORKSPACE: /var/lib/startrek/workspace
      # conectores MCP via npx: cache persistente (não baixa de novo a cada reinício)
      npm_config_cache: /var/lib/startrek/npm-cache
      npm_config_update_notifier: "false"
    volumes:
      # mesmo caminho dentro e fora: o terminal dos agentes cria containers irmãos que montam essas pastas
      - /var/lib/startrek:/var/lib/startrek
      # terminal dos agentes (containers descartáveis). Remova esta linha para desligar o terminal.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - freellmapi
    networks: [proxy]

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: star-trek-freellmapi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?defina FREELLMAPI_ENCRYPTION_KEY}
    volumes:
      - freellmapi-data:/app/server/data
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?defina PROXY_NETWORK}

volumes:
  freellmapi-data:
